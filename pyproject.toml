[project]
name = "mega-moodle"
version = "0.1.0"
description = "Interface desktop para cadastro de disciplinas e disponibilidade"
readme = "README.md"
authors = [
    { name = "Gustavo Sonntag Dorow", email = "gustavosdorow@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.11.2",
]

[project.scripts]
mega-moodle = "mega_moodle:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
